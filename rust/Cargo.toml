[package]
name = "pump-sniper"
version = "0.1.0"
edition = "2021"
description = "Pump.fun new token sniper - Yellowstone gRPC + buy"

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
futures = "0.3"
solana-sdk = "2"
solana-client = "2"
tokio = { version = "1", features = ["full"] }
yellowstone-grpc-client = "12.0"
yellowstone-grpc-proto = "12.0"
pumpfun = { version = "4.6", default-features = false, features = ["create-ata"] }
spl-associated-token-account = "6"
bs58 = "0.5"
serde_json = "1.0"
