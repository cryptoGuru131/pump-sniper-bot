[package]
name = "pump-sniper"
version = "0.1.0"
edition = "2021"
description = "Pump.fun token sniper - low-latency Yellowstone gRPC streaming"

[[bin]]
name = "pump-sniper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bs58 = "0.5"
dotenvy = "0.15"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["tls-ring"] }
yellowstone-grpc-client = "12"
yellowstone-grpc-proto = "12"
